services:
  vpn-gateway:
    image: qmcgaw/gluetun
    container_name: vpn-gateway
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - VPN_TYPE=openvpn
      - VPN_SERVICE_PROVIDER=your vpn
      - OPENVPN_USER=${YOUR_VPN_USER}
      - OPENVPN_PASSWORD=${YOUR_VPN_PASSWORD}
      - SERVER_REGIONS=CA Toronto
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=your vpn
      - VPN_PORT_FORWARDING_STATUS_FILE=/port/forwarded_port
      - FIREWALL_VPN_INPUT_PORTS=8000,8080,8989,7878,6881
      - FIREWALL_OUTBOUND_SUBNETS=SERVER_SUBNET/24
      - DOT=off
      - DNS_ADDRESS=8.8.8.8
      - DNS_KEEP_NAMESERVER=on
      - IPV6=off
    volumes:
      - /home/configs/gluetun/auth:/gluetun/auth
      - port_data:/port
    ports:
      - 8080:8080
      - 8989:8989
      - 7878:7878
      - 9696:9696
      - 8000:8000
      - 8191:8191
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    network_mode: service:vpn-gateway
    depends_on:
      - vpn-gateway
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /home/qbittorrent/config:/config
      - port_data:/port:ro
      - /mnt/media/downloads:/downloads
      - /mnt/media/media/audiobooks:/data/audiobooks
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:develop
    container_name: sonarr
    network_mode: service:vpn-gateway
    depends_on:
      - vpn-gateway
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /home/sonarr/config:/config
      - /mnt/media/tv:/tv
      - /mnt/media/downloads:/downloads
      - /mnt/media/media/tv:/data/tv
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:develop
    container_name: radarr
    network_mode: service:vpn-gateway
    depends_on:
      - vpn-gateway
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /home/radarr/config:/config
      - /mnt/media/movies:/movies
      - /mnt/media/downloads:/downloads
      - /mnt/media/media/movies:/data/movies
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:vpn-gateway
    depends_on:
      - vpn-gateway
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /home/prowlarr/config:/config
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: service:vpn-gateway
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped

  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    network_mode: host
    environment:
      - PLEX_CLAIM=
      - TZ=America/Toronto
    volumes:
      - /home/plex/config:/config
      - /home/plex/transcode:/transcode
      - /mnt/media/plex_media:/data/media
      - /mnt/media/media/movies:/data/movies:ro
      - /mnt/media/media/tv:/data/tv:ro
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /home/media/jarr/config:/config
      - /home/media/jarr/cache:/cache
      - /mnt/media/jellyfin_media:/data/media
      - /mnt/media/media/movies:/data/movies:ro
      - /mnt/media/media/tv:/data/tv:ro
    restart: unless-stopped

  threadfin:
    image: fyb3roptik/threadfin:latest
    container_name: threadfin
    ports:
      - "34400:34400"
      - "34401:34401"
    volumes:
      - /home/threadfin/config:/config
    restart: unless-stopped

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - 13378:80
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /home/audiobookshelf/config:/config
      - /home/auth/audiobookshelf/metadata:/metadata
      - /mnt/media/audiobookshelf_media:/data/media
      - /mnt/media/media/audiobooks:/data/audiobooks:ro
    restart: unless-stopped

  bindery:
    user: "1000:1000"
    build: https://github.com/vavallee/bindery.git
    container_name: bindery
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/bindery/config:/config
      - /mnt/media/media/audiobooks:/data/audiobooks
      - /mnt/media/downloads:/downloads
    ports:
      - "5050:8787"
    depends_on:
      - prowlarr

  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    ports:
      - 8089:80
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /home/nextcloud/config:/config
      - /mnt/media/nextcloud_data:/data
      - /mnt/media:/external_media:ro
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - /home/homepage/config:/app/config
      - /home/homepage/icons:/app/public/icons
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=SERVER_IP:3000,localhost:3000

  caddy:
    image: caddy:latest
    container_name: caddy
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
      - DOMAIN=YOUR_DOMAIN.org
    volumes:
      - /home/caddy/data:/data
      - /home/caddy/config:/config
      - /home/caddy/Caddyfile:/etc/caddy/Caddyfile
    restart: unless-stopped

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy
    container_name: wg-easy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - WG_HOST=YOUR_DOMAIN.org
      - WG_ALLOWED_IPS=192.168.0.0/24
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEFAULT_DNS=1.1.1.1
    volumes:
      - /home/wg-easy:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    restart: unless-stopped

volumes:
  port_data:
